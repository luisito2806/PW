<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso Admin — Doo Barber</title>
    <meta name="description" content="Panel de administración para Doo Barber. Acceso exclusivo para administradores.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        /* Paleta "Latón": crema, carbón y acento latón (el acento lo ajusta tema.js) */
        :root {
            --bg:             #F7F4EE;
            --surface:        #FFFDF9;
            --surface-2:      #F0EBE1;
            --border:         #E2D9C8;
            --border-mid:     #CFC4AF;
            --ink:            #17140F;
            --ink-2:          #4A4236;
            --ink-3:          #6F6553;
            --accent:         #B8893A;
            --on-accent:      #17140F;
            --accent-text:    #7D5D27;
            --accent-hover:   color-mix(in srgb, var(--accent) 85%, #000);
            --accent-dim:     color-mix(in srgb, var(--accent) 12%, transparent);
            --accent-glow:    color-mix(in srgb, var(--accent) 24%, transparent);
            --danger:         #B42318;
            --radius-sm: 12px;
            --radius-md: 18px;
            --radius-lg: 24px;
            --radius-xl: 32px;
            --radius-full:999px;
            --tx:        0.18s cubic-bezier(0.4,0,0.2,1);
        }

        *,*::before,*::after { box-sizing:border-box; margin:0; padding:0; }
        html,body { height:100%; }

        body {
            font-family:'Outfit',-apple-system,BlinkMacSystemFont,sans-serif;
            background:var(--bg);
            color:var(--ink);
            display:flex;
            align-items:center;
            justify-content:center;
            min-height:100vh;
            -webkit-font-smoothing:antialiased;
            position:relative;
            overflow:hidden;
            padding:16px;
        }

        /* ── BACKGROUND EFFECTS ── */
        .bg-glow {
            position:fixed;
            inset:0;
            pointer-events:none;
            z-index:0;
        }

        .bg-glow::before {
            content:'';
            position:absolute;
            top:-20%;
            left:-10%;
            width:60%;
            height:60%;
            background:radial-gradient(ellipse, color-mix(in srgb, var(--accent) 14%, transparent) 0%, transparent 65%);
            animation:drift 12s ease-in-out infinite alternate;
        }

        .bg-glow::after {
            content:'';
            position:absolute;
            bottom:-20%;
            right:-10%;
            width:55%;
            height:55%;
            background:radial-gradient(ellipse, color-mix(in srgb, var(--ink) 6%, transparent) 0%, transparent 65%);
            animation:drift2 15s ease-in-out infinite alternate;
        }

        @keyframes drift  { 0%{transform:translate(0,0)} 100%{transform:translate(5%,8%)} }
        @keyframes drift2 { 0%{transform:translate(0,0)} 100%{transform:translate(-5%,-8%)} }

        /* ── CARD ── */
        .login-card {
            position:relative;
            z-index:10;
            background:var(--surface);
            border:1px solid var(--border);
            border-radius:var(--radius-xl);
            padding:40px 36px 36px;
            width:100%;
            max-width:380px;
            box-shadow:0 24px 64px rgba(23,20,15,0.10), 0 4px 14px rgba(23,20,15,0.05);
            animation:fadeUp .4s cubic-bezier(0.4,0,0.2,1);
        }

        @keyframes fadeUp {
            from { opacity:0; transform:translateY(20px); }
            to   { opacity:1; transform:translateY(0);    }
        }

        /* ── LOGO ── */
        .card-logo {
            display:flex;
            flex-direction:column;
            align-items:center;
            margin-bottom:28px;
        }

        .logo-icon {
            display:flex;
            align-items:center;
            margin-bottom:14px;
        }

        .marca-monograma, .marca-logo {
            width:52px;
            height:52px;
            border-radius:14px;
        }
        .marca-monograma {
            display:flex;
            align-items:center;
            justify-content:center;
            background:var(--ink);
            color:var(--accent-on-dark, var(--accent));
            font-size:24px;
            font-weight:800;
            box-shadow:inset 0 0 0 2px var(--accent);
        }
        .marca-logo { object-fit:cover; border:1px solid var(--border); }

        .brand-name {
            font-size:22px;
            font-weight:800;
            color:var(--ink);
            letter-spacing:-0.5px;
            margin-bottom:6px;
        }

        .brand-sub {
            font-size:13px;
            color:var(--ink-3);
            font-weight:500;
        }

        /* ── FORM ── */
        .form-label {
            display:block;
            font-size:11px;
            font-weight:700;
            color:var(--ink-3);
            letter-spacing:0.1em;
            text-transform:uppercase;
            margin-bottom:8px;
        }

        .input-wrap {
            position:relative;
            margin-bottom:20px;
        }

        .input-icon {
            position:absolute;
            left:15px;
            top:50%;
            transform:translateY(-50%);
            color:var(--ink-3);
            display:flex;
            align-items:center;
            pointer-events:none;
        }

        .form-input {
            width:100%;
            padding:14px 46px 14px 44px;
            background:var(--surface-2);
            border:1.5px solid var(--border);
            border-radius:var(--radius-sm);
            font-family:inherit;
            font-size:15px;
            color:var(--ink);
            outline:none;
            transition:border-color var(--tx), box-shadow var(--tx);
            letter-spacing:0.5px;
        }

        .form-input::placeholder { color:var(--ink-3); letter-spacing:0; }

        .form-input:focus {
            border-color:var(--accent);
            box-shadow:0 0 0 3px var(--accent-glow);
            background:var(--surface);
        }

        .toggle-pw {
            position:absolute;
            right:14px;
            top:50%;
            transform:translateY(-50%);
            background:none;
            border:none;
            cursor:pointer;
            color:var(--ink-3);
            display:flex;
            align-items:center;
            padding:4px;
            border-radius:6px;
            transition:color var(--tx);
        }

        .toggle-pw:hover { color:var(--ink-2); }

        /* ── SUBMIT ── */
        .btn-login {
            width:100%;
            padding:15px;
            background:var(--accent);
            color:var(--on-accent);
            font-family:inherit;
            font-size:15px;
            font-weight:700;
            border:none;
            border-radius:var(--radius-full);
            cursor:pointer;
            transition:all var(--tx);
            letter-spacing:-0.1px;
            position:relative;
            overflow:hidden;
        }

        .btn-login:hover:not(:disabled) {
            background:var(--accent-hover);
            box-shadow:0 8px 28px var(--accent-glow);
            transform:translateY(-1px);
        }

        .btn-login:disabled {
            opacity:0.55;
            cursor:not-allowed;
            transform:none;
        }

        .btn-login .btn-inner {
            display:flex;
            align-items:center;
            justify-content:center;
            gap:8px;
        }

        .btn-spinner {
            display:none;
            width:16px;
            height:16px;
            border:2.5px solid color-mix(in srgb, var(--on-accent) 35%, transparent);
            border-top-color:var(--on-accent);
            border-radius:50%;
            animation:spin .6s linear infinite;
        }

        @keyframes spin { to { transform:rotate(360deg); } }

        .btn-login.loading .btn-text   { opacity:0; }
        .btn-login.loading .btn-spinner { display:block; }

        /* ── ERROR ── */
        .error-msg {
            margin-top:14px;
            padding:11px 14px;
            background:color-mix(in srgb, var(--danger) 8%, transparent);
            border:1px solid color-mix(in srgb, var(--danger) 25%, transparent);
            border-radius:var(--radius-sm);
            font-size:13px;
            font-weight:600;
            color:var(--danger);
            text-align:center;
            display:none;
        }

        .error-msg.show { display:block; animation:shake .35s ease; }

        @keyframes shake {
            0%,100%{ transform:translateX(0); }
            25%    { transform:translateX(-6px); }
            75%    { transform:translateX(6px); }
        }

        /* ── FOOTER ── */
        .card-footer {
            margin-top:24px;
            text-align:center;
        }

        .footer-link {
            font-size:13px;
            color:var(--ink-3);
            text-decoration:none;
            transition:color var(--tx);
            font-weight:500;
        }

        .footer-link:hover { color:var(--accent-text); }
    </style>
</head>
<body>

<div class="bg-glow"></div>

<div class="login-card">
    <!-- Logo -->
    <div class="card-logo">
        <div class="logo-icon" id="loginMarca"><span class="marca-monograma">D</span></div>
        <div class="brand-name" id="loginNombre">Doo Barber</div>
        <div class="brand-sub">Panel de Administración</div>
    </div>

    <!-- Form -->
    <form id="formLogin" novalidate>
        <label class="form-label" for="password">Contraseña</label>
        <div class="input-wrap">
            <span class="input-icon">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                    <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                </svg>
            </span>
            <input type="password" id="password" class="form-input"
                   placeholder="Ingresa tu contraseña"
                   required autocomplete="current-password" autofocus>
            <button type="button" class="toggle-pw" id="togglePw" aria-label="Mostrar contraseña">
                <svg id="eyeShow" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                    <circle cx="12" cy="12" r="3"></circle>
                </svg>
                <svg id="eyeHide" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none">
                    <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"></path>
                    <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"></path>
                    <line x1="1" y1="1" x2="23" y2="23"></line>
                </svg>
            </button>
        </div>

        <button type="submit" class="btn-login" id="btnLogin">
            <span class="btn-inner">
                <span class="btn-text">Entrar al Panel</span>
                <div class="btn-spinner"></div>
            </span>
        </button>

        <div class="error-msg" id="errorMsg"></div>
    </form>

    <div class="card-footer">
        <a href="/" class="footer-link">← Volver al sitio de clientes</a>
    </div>

</div>

<script src="tema.js"></script>
<script>
    const API_URL = window.location.origin;

    // Nombre, logo y color de la barbería (marca blanca)
    fetch(`${API_URL}/api/marca`)
        .then(res => res.ok ? res.json() : null)
        .then(marca => {
            if (!marca) return;
            document.getElementById('loginNombre').textContent = marca.nombre_negocio;
            document.title = `Acceso Admin — ${marca.nombre_negocio}`;
            pintarMarca(document.getElementById('loginMarca'), marca.nombre_negocio, marca.logo_url);
            aplicarColorPrimario(marca.color_primario);
        })
        .catch(() => {});

    // If already logged in, redirect
    if (localStorage.getItem('adminToken')) {
        window.location.href = 'admin.html';
    }

    // Toggle password visibility
    document.getElementById('togglePw').addEventListener('click', () => {
        const input   = document.getElementById('password');
        const eyeShow = document.getElementById('eyeShow');
        const eyeHide = document.getElementById('eyeHide');
        const isPass  = input.type === 'password';
        input.type    = isPass ? 'text' : 'password';
        eyeShow.style.display = isPass ? 'none' : 'block';
        eyeHide.style.display = isPass ? 'block' : 'none';
    });

    // Form submit
    document.getElementById('formLogin').addEventListener('submit', async e => {
        e.preventDefault();
        const password = document.getElementById('password').value;
        const btn      = document.getElementById('btnLogin');
        const errorDiv = document.getElementById('errorMsg');

        errorDiv.classList.remove('show');
        errorDiv.textContent = '';
        btn.classList.add('loading');
        btn.disabled = true;

        try {
            const res  = await fetch(`${API_URL}/api/login`, {
                method:'POST',
                headers:{ 'Content-Type':'application/json' },
                body:JSON.stringify({ password })
            });
            const data = await res.json();

            if (res.ok) {
                localStorage.setItem('adminToken', data.token);
                window.location.href = 'admin.html';
            } else {
                errorDiv.textContent = data.error || 'Contraseña incorrecta';
                errorDiv.classList.add('show');
            }
        } catch {
            errorDiv.textContent = 'Error de conexión con el servidor';
            errorDiv.classList.add('show');
        } finally {
            btn.classList.remove('loading');
            btn.disabled = false;
        }
    });
</script>
</body>
</html>
