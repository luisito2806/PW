<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso Admin — Doo Barber</title>
    <meta name="description" content="Panel de administración para Doo Barber. Acceso exclusivo para administradores.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg:        #0a0a0f;
            --surface:   #111118;
            --surface-2: #18181f;
            --border:    #2a2a38;
            --ink:       #f0f0f8;
            --ink-2:     #9090a8;
            --ink-3:     #55556a;
            --accent:    #00c285;
            --accent-d:  #00a872;
            --accent-dim:rgba(0,194,133,0.10);
            --accent-glo:rgba(0,194,133,0.22);
            --danger:    #f43f5e;
            --radius-sm: 12px;
            --radius-md: 18px;
            --radius-lg: 24px;
            --radius-xl: 32px;
            --radius-full:999px;
            --tx:        0.18s cubic-bezier(0.4,0,0.2,1);
        }

        *,*::before,*::after { box-sizing:border-box; margin:0; padding:0; }
        html,body { height:100%; }

        body {
            font-family:'Outfit',-apple-system,BlinkMacSystemFont,sans-serif;
            background:var(--bg);
            color:var(--ink);
            display:flex;
            align-items:center;
            justify-content:center;
            min-height:100vh;
            -webkit-font-smoothing:antialiased;
            position:relative;
            overflow:hidden;
        }

        /* ── BACKGROUND EFFECTS ── */
        .bg-glow {
            position:fixed;
            inset:0;
            pointer-events:none;
            z-index:0;
        }

        .bg-glow::before {
            content:'';
            position:absolute;
            top:-20%;
            left:-10%;
            width:60%;
            height:60%;
            background:radial-gradient(ellipse, rgba(0,194,133,0.07) 0%, transparent 65%);
            animation:drift 12s ease-in-out infinite alternate;
        }

        .bg-glow::after {
            content:'';
            position:absolute;
            bottom:-20%;
            right:-10%;
            width:55%;
            height:55%;
            background:radial-gradient(ellipse, rgba(167,139,250,0.06) 0%, transparent 65%);
            animation:drift2 15s ease-in-out infinite alternate;
        }

        @keyframes drift  { 0%{transform:translate(0,0)} 100%{transform:translate(5%,8%)} }
        @keyframes drift2 { 0%{transform:translate(0,0)} 100%{transform:translate(-5%,-8%)} }

        /* ── CARD ── */
        .login-card {
            position:relative;
            z-index:10;
            background:rgba(17,17,24,0.9);
            backdrop-filter:blur(24px);
            -webkit-backdrop-filter:blur(24px);
            border:1px solid var(--border);
            border-radius:var(--radius-xl);
            padding:40px 36px 36px;
            width:100%;
            max-width:380px;
            box-shadow:0 32px 80px rgba(0,0,0,0.5), 0 8px 24px rgba(0,0,0,0.3),
                       inset 0 1px 0 rgba(255,255,255,0.06);
            animation:fadeUp .4s cubic-bezier(0.4,0,0.2,1);
        }

        @keyframes fadeUp {
            from { opacity:0; transform:translateY(20px); }
            to   { opacity:1; transform:translateY(0);    }
        }

        /* ── LOGO ── */
        .card-logo {
            display:flex;
            flex-direction:column;
            align-items:center;
            margin-bottom:28px;
        }

        .logo-icon {
            display:flex;
            align-items:center;
            margin-bottom:14px;
        }

        .logo-dot {
            width:14px;
            height:14px;
            border-radius:50%;
        }

        .logo-dot + .logo-dot { margin-left:-4px; }
        .dot-g { background:#00c285; }
        .dot-v { background:#a78bfa; }
        .dot-b { background:#60a5fa; }

        .brand-name {
            font-size:22px;
            font-weight:800;
            color:var(--ink);
            letter-spacing:-0.5px;
            margin-bottom:6px;
        }

        .brand-sub {
            font-size:13px;
            color:var(--ink-3);
            font-weight:500;
        }

        /* ── FORM ── */
        .form-label {
            display:block;
            font-size:11px;
            font-weight:700;
            color:var(--ink-3);
            letter-spacing:0.1em;
            text-transform:uppercase;
            margin-bottom:8px;
        }

        .input-wrap {
            position:relative;
            margin-bottom:20px;
        }

        .input-icon {
            position:absolute;
            left:15px;
            top:50%;
            transform:translateY(-50%);
            color:var(--ink-3);
            display:flex;
            align-items:center;
            pointer-events:none;
        }

        .form-input {
            width:100%;
            padding:14px 46px 14px 44px;
            background:var(--surface-2);
            border:1.5px solid var(--border);
            border-radius:var(--radius-sm);
            font-family:inherit;
            font-size:15px;
            color:var(--ink);
            outline:none;
            transition:border-color var(--tx), box-shadow var(--tx);
            letter-spacing:0.5px;
        }

        .form-input::placeholder { color:var(--ink-3); letter-spacing:0; }

        .form-input:focus {
            border-color:var(--accent);
            box-shadow:0 0 0 3px var(--accent-glo);
        }

        .toggle-pw {
            position:absolute;
            right:14px;
            top:50%;
            transform:translateY(-50%);
            background:none;
            border:none;
            cursor:pointer;
            color:var(--ink-3);
            display:flex;
            align-items:center;
            padding:4px;
            border-radius:6px;
            transition:color var(--tx);
        }

        .toggle-pw:hover { color:var(--ink-2); }

        /* ── SUBMIT ── */
        .btn-login {
            width:100%;
            padding:15px;
            background:var(--accent);
            color:#fff;
            font-family:inherit;
            font-size:15px;
            font-weight:700;
            border:none;
            border-radius:var(--radius-full);
            cursor:pointer;
            transition:all var(--tx);
            letter-spacing:-0.1px;
            position:relative;
            overflow:hidden;
        }

        .btn-login:hover:not(:disabled) {
            background:var(--accent-d);
            box-shadow:0 8px 28px var(--accent-glo);
            transform:translateY(-1px);
        }

        .btn-login:disabled {
            opacity:0.55;
            cursor:not-allowed;
            transform:none;
        }

        .btn-login .btn-inner {
            display:flex;
            align-items:center;
            justify-content:center;
            gap:8px;
        }

        .btn-spinner {
            display:none;
            width:16px;
            height:16px;
            border:2.5px solid rgba(255,255,255,0.35);
            border-top-color:#fff;
            border-radius:50%;
            animation:spin .6s linear infinite;
        }

        @keyframes spin { to { transform:rotate(360deg); } }

        .btn-login.loading .btn-text   { opacity:0; }
        .btn-login.loading .btn-spinner { display:block; }

        /* ── ERROR ── */
        .error-msg {
            margin-top:14px;
            padding:11px 14px;
            background:rgba(244,63,94,0.1);
            border:1px solid rgba(244,63,94,0.22);
            border-radius:var(--radius-sm);
            font-size:13px;
            font-weight:600;
            color:#fb7185;
            text-align:center;
            display:none;
        }

        .error-msg.show { display:block; animation:shake .35s ease; }

        @keyframes shake {
            0%,100%{ transform:translateX(0); }
            25%    { transform:translateX(-6px); }
            75%    { transform:translateX(6px); }
        }

        /* ── FOOTER ── */
        .card-footer {
            margin-top:24px;
            text-align:center;
        }

        .footer-link {
            font-size:13px;
            color:var(--ink-3);
            text-decoration:none;
            transition:color var(--tx);
            font-weight:500;
        }

        .footer-link:hover { color:var(--accent); }

        /* ── SECURITY BADGE ── */
        .security-badge {
            display:flex;
            align-items:center;
            justify-content:center;
            gap:6px;
            margin-top:20px;
            font-size:11px;
            color:var(--ink-3);
            font-weight:600;
        }
    </style>
</head>
<body>

<div class="bg-glow"></div>

<div class="login-card">
    <!-- Logo -->
    <div class="card-logo">
        <div class="logo-icon">
            <span class="logo-dot dot-g"></span>
            <span class="logo-dot dot-v"></span>
            <span class="logo-dot dot-b"></span>
        </div>
        <div class="brand-name">Doo Barber</div>
        <div class="brand-sub">Panel de Administración</div>
    </div>

    <!-- Form -->
    <form id="formLogin" novalidate>
        <label class="form-label" for="password">Contraseña</label>
        <div class="input-wrap">
            <span class="input-icon">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                    <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                </svg>
            </span>
            <input type="password" id="password" class="form-input"
                   placeholder="Ingresa tu contraseña"
                   required autocomplete="current-password" autofocus>
            <button type="button" class="toggle-pw" id="togglePw" aria-label="Mostrar contraseña">
                <svg id="eyeShow" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                    <circle cx="12" cy="12" r="3"></circle>
                </svg>
                <svg id="eyeHide" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none">
                    <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"></path>
                    <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"></path>
                    <line x1="1" y1="1" x2="23" y2="23"></line>
                </svg>
            </button>
        </div>

        <button type="submit" class="btn-login" id="btnLogin">
            <span class="btn-inner">
                <span class="btn-text">Entrar al Panel</span>
                <div class="btn-spinner"></div>
            </span>
        </button>

        <div class="error-msg" id="errorMsg"></div>
    </form>

    <div class="card-footer">
        <a href="/" class="footer-link">← Volver al sitio de clientes</a>
    </div>

    <div class="security-badge">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
        </svg>
        Conexión segura
    </div>
</div>

<script>
    const API_URL = window.location.origin;

    // If already logged in, redirect
    if (localStorage.getItem('adminToken')) {
        window.location.href = 'admin.html';
    }

    // Toggle password visibility
    document.getElementById('togglePw').addEventListener('click', () => {
        const input   = document.getElementById('password');
        const eyeShow = document.getElementById('eyeShow');
        const eyeHide = document.getElementById('eyeHide');
        const isPass  = input.type === 'password';
        input.type    = isPass ? 'text' : 'password';
        eyeShow.style.display = isPass ? 'none' : 'block';
        eyeHide.style.display = isPass ? 'block' : 'none';
    });

    // Form submit
    document.getElementById('formLogin').addEventListener('submit', async e => {
        e.preventDefault();
        const password = document.getElementById('password').value;
        const btn      = document.getElementById('btnLogin');
        const errorDiv = document.getElementById('errorMsg');

        errorDiv.classList.remove('show');
        errorDiv.textContent = '';
        btn.classList.add('loading');
        btn.disabled = true;

        try {
            const res  = await fetch(`${API_URL}/api/login`, {
                method:'POST',
                headers:{ 'Content-Type':'application/json' },
                body:JSON.stringify({ password })
            });
            const data = await res.json();

            if (res.ok) {
                localStorage.setItem('adminToken', data.token);
                window.location.href = 'admin.html';
            } else {
                errorDiv.textContent = data.error || 'Contraseña incorrecta';
                errorDiv.classList.add('show');
            }
        } catch {
            errorDiv.textContent = 'Error de conexión con el servidor';
            errorDiv.classList.add('show');
        } finally {
            btn.classList.remove('loading');
            btn.disabled = false;
        }
    });
</script>
</body>
</html>
