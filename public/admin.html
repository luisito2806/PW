<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración - Barbería</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 20px;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #333;
            padding-bottom: 15px;
            margin-bottom: 20px;
        }
        h1 { color: #f39c12; margin: 0; }
        .box {
            background: #1e1e1e;
            padding: 15px 20px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        input, button {
            padding: 8px 12px;
            border-radius: 4px;
            border: 1px solid #444;
            background: #2d3436;
            color: #fff;
        }
        button {
            background-color: #f39c12;
            font-weight: bold;
            border: none;
            cursor: pointer;
        }
        button:hover { background-color: #d68910; }
        .metrics { display: flex; gap: 20px; margin-bottom: 25px; }
        .card {
            background: #1e1e1e;
            padding: 15px 20px;
            border-radius: 8px;
            flex: 1;
        }
        .card h3 { margin-top: 0; color: #b2bec3; font-size: 13px; }
        .card p { font-size: 22px; font-weight: bold; color: #00b894; margin: 0; }
        .grid-desglose {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }
        .item-desglose {
            background: #242424;
            padding: 12px;
            border-radius: 6px;
            border-left: 4px solid #f39c12;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            background: #1e1e1e;
            border-radius: 8px;
            overflow: hidden;
            margin-bottom: 30px;
        }
        th, td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid #333;
        }
        th { background-color: #2d3436; color: #f39c12; }
        .badge {
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
            text-transform: uppercase;
        }
        .badge-pendiente { background-color: #d35400; color: white; }
        .badge-completada { background-color: #00b894; color: white; }
        .btn-completar {
            background-color: #00b894;
            padding: 5px 10px;
            margin-right: 5px;
        }
        .btn-completar:hover { background-color: #00a382; }
        .btn-cancelar {
            background-color: #d63031;
            padding: 5px 10px;
        }
        .btn-cancelar:hover { background-color: #e17055; }
        .btn-logout {
            background-color: #c0392b;
            color: #fff;
            padding: 8px 14px;
            font-size: 13px;
        }
        .btn-logout:hover { background-color: #e74c3c; }
    </style>
</head>
<body>

    <div class="header">
        <div>
            <h1>Panel de Control</h1>
            <span style="color: #888;">Barbería Central</span>
        </div>
        <button class="btn-logout" onclick="cerrarSesion()">Cerrar Sesión</button>
    </div>

    <!-- Bloquear Días -->
    <div class="box">
        <h3>Bloquear Día por Imprevisto o Evento</h3>
        <input type="date" id="fechaBloqueo">
        <input type="text" id="motivoBloqueo" placeholder="Motivo (ej. Curso, descanso)">
        <button onclick="bloquearDia()">Bloquear Fecha</button>
        <div id="listaBloqueos" style="margin-top: 15px; font-size: 14px;"></div>
    </div>

    <!-- Filtro -->
    <div class="box" style="display: flex; gap: 10px; align-items: center;">
        <label>Filtrar citas por fecha:</label>
        <input type="date" id="filtroFecha">
        <button onclick="consultarDatos()">Filtrar</button>
        <button onclick="limpiarFiltro()" style="background-color: #636e72;">Ver Todo</button>
    </div>

    <!-- Métricas -->
    <div class="metrics">
        <div class="card">
            <h3>Ingresos Cobrados</h3>
            <p id="totalGanancias">$0 MXN</p>
        </div>
        <div class="card">
            <h3>Total Citas Registradas</h3>
            <p id="totalCitas">0</p>
        </div>
    </div>

    <h3>Desglose de Servicios Cobrados</h3>
    <div class="grid-desglose" id="contenedorDesglose"></div>

    <h2>Agenda de Citas</h2>
    <table>
        <thead>
            <tr>
                <th>Fecha</th>
                <th>Hora</th>
                <th>Cliente</th>
                <th>Teléfono</th>
                <th>Servicio</th>
                <th>Total</th>
                <th>Estado</th>
                <th>Acciones</th>
            </tr>
        </thead>
        <tbody id="tablaCitas"></tbody>
    </table>

    <script>
        // 1. Verificación de Seguridad Inmediata
        const token = localStorage.getItem('adminToken');
        if (!token) {
            window.location.href = '/login.html';
        }

        const authHeaders = {
            'Content-Type': 'application/json',
            'Authorization': token
        };

        function cerrarSesion() {
            localStorage.removeItem('adminToken');
            window.location.href = '/login.html';
        }

        async function cargarReporte(fecha = '') {
            try {
                const url = fecha ? `/api/reportes?fecha=${fecha}` : '/api/reportes';
                const res = await fetch(url, { headers: authHeaders });

                if (res.status === 403 || res.status === 401) {
                    cerrarSesion();
                    return;
                }

                const data = await res.json();

                document.getElementById('totalGanancias').innerText = `$${data.totalGanancias || 0} MXN`;
                document.getElementById('totalCitas').innerText = `${data.totalCitas || 0}`;

                const contDesglose = document.getElementById('contenedorDesglose');
                contDesglose.innerHTML = '';

                if (!data.desglose || data.desglose.length === 0) {
                    contDesglose.innerHTML = '<p style="color: #888;">No hay servicios completados/cobrados aún.</p>';
                } else {
                    data.desglose.forEach(item => {
                        contDesglose.innerHTML += `
                            <div class="item-desglose">
                                <strong>${item.servicio}</strong>
                                <p>Citas: ${item.cantidad}</p>
                                <p>Total: <strong>$${item.total} MXN</strong></p>
                            </div>
                        `;
                    });
                }

                const tbody = document.getElementById('tablaCitas');
                tbody.innerHTML = '';

                if (!data.citas || data.citas.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="8" style="text-align:center;">No hay citas registradas.</td></tr>';
                } else {
                    data.citas.forEach(cita => {
                        const estado = cita.estado || 'pendiente';
                        const esCompletada = estado === 'completada';

                        const botonCobrar = !esCompletada 
                            ? `<button class="btn-completar" onclick="cambiarEstado(${cita.id}, 'completada')">Cobrar</button>`
                            : `<button style="background: none; border: 1px solid #888; color: #888; padding: 4px 8px; font-size: 11px;" onclick="cambiarEstado(${cita.id}, 'pendiente')">Revertir</button>`;

                        tbody.innerHTML += `
                            <tr>
                                <td>${cita.fecha}</td>
                                <td>${cita.hora}</td>
                                <td>${cita.cliente}</td>
                                <td>${cita.telefono}</td>
                                <td>${cita.servicio}</td>
                                <td>$${cita.precio}</td>
                                <td><span class="badge badge-${estado}">${estado}</span></td>
                                <td>
                                    ${botonCobrar}
                                    <button class="btn-cancelar" onclick="eliminarCita(${cita.id})">Cancelar</button>
                                </td>
                            </tr>
                        `;
                    });
                }
            } catch (err) {
                console.error(err);
            }
        }

        async function cambiarEstado(id, nuevoEstado) {
            try {
                const res = await fetch(`/api/citas/${id}/estado`, {
                    method: 'PATCH',
                    headers: authHeaders,
                    body: JSON.stringify({ estado: nuevoEstado })
                });

                if (res.ok) {
                    cargarReporte(document.getElementById('filtroFecha').value);
                } else {
                    alert('Error al actualizar estado.');
                }
            } catch (err) {
                console.error(err);
            }
        }

        async function eliminarCita(id) {
            if (!confirm('¿Seguro que deseas cancelar esta cita?')) return;

            try {
                const res = await fetch(`/api/citas/${id}`, { 
                    method: 'DELETE',
                    headers: authHeaders
                });
                if (res.ok) {
                    cargarReporte(document.getElementById('filtroFecha').value);
                } else {
                    alert('Error al cancelar la cita.');
                }
            } catch (error) {
                console.error('Error al eliminar:', error);
            }
        }

        async function cargarBloqueos() {
            try {
                const res = await fetch('/api/bloqueos', { headers: authHeaders });
                const bloqueos = await res.json();
                const div = document.getElementById('listaBloqueos');
                
                if (!Array.isArray(bloqueos) || bloqueos.length === 0) {
                    div.innerHTML = '<span style="color: #888;">No hay días bloqueados actualmente.</span>';
                    return;
                }

                div.innerHTML = '<strong>Días deshabilitados:</strong><br>';
                bloqueos.forEach(b => {
                    div.innerHTML += `
                        <div style="margin-top: 5px;">
                            📅 ${b.fecha}: ${b.motivo} 
                            <button onclick="desbloquearDia(${b.id})" style="background: none; border: 1px solid #e74c3c; color: #e74c3c; padding: 2px 6px; font-size: 11px; margin-left: 10px; cursor: pointer;">Desbloquear</button>
                        </div>
                    `;
                });
            } catch (error) {
                console.error(error);
            }
        }

        async function bloquearDia(forzar = false) {
            const fecha = document.getElementById('fechaBloqueo').value;
            const motivo = document.getElementById('motivoBloqueo').value.trim();

            if (!fecha || !motivo) {
                alert('Por favor indica fecha y motivo.');
                return;
            }

            try {
                const res = await fetch('/api/bloqueos', {
                    method: 'POST',
                    headers: authHeaders,
                    body: JSON.stringify({ fecha, motivo, forzar })
                });

                const data = await res.json();

                if (res.status === 409 && data.advertencia) {
                    let listaClientes = data.citas.map(c => `• ${c.hora} - ${c.cliente} (${c.telefono})`).join('\n');
                    const confirma = confirm(
                        `Atención: Ya hay ${data.totalCitas} cita(s) agendada(s) ese día:\n\n` +
                        listaClientes + 
                        `\n\n¿Deseas bloquear el día de todos modos y cancelar estas citas automáticamente?`
                    );

                    if (confirma) {
                        bloquearDia(true);
                    }
                    return;
                }

                if (res.ok) {
                    alert(data.mensaje);
                    document.getElementById('fechaBloqueo').value = '';
                    document.getElementById('motivoBloqueo').value = '';
                    cargarBloqueos();
                    cargarReporte(document.getElementById('filtroFecha').value);
                } else {
                    alert('Error: ' + (data.error || 'No se pudo procesar el bloqueo.'));
                }
            } catch (err) {
                console.error(err);
                alert('Error de conexión.');
            }
        }

        async function desbloquearDia(id) {
            if (!confirm('¿Deseas habilitar nuevamente esta fecha para agendar citas?')) return;

            try {
                const res = await fetch(`/api/bloqueos/${id}`, { 
                    method: 'DELETE',
                    headers: authHeaders
                });
                if (res.ok) {
                    cargarBloqueos();
                } else {
                    alert('Error al desbloquear fecha.');
                }
            } catch (error) {
                console.error(error);
            }
        }

        function consultarDatos() {
            const fecha = document.getElementById('filtroFecha').value;
            if (fecha) cargarReporte(fecha);
        }

        function limpiarFiltro() {
            document.getElementById('filtroFecha').value = '';
            cargarReporte();
        }

        cargarReporte();
        cargarBloqueos();
    </script>

</body>
</html>
